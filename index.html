<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NCA Ref">
  <meta name="theme-color" content="#0d1117">
  <title>NCA Tools - EMER / QRH / MEL</title>
  <link rel="stylesheet" href="ref.css">
  <script src="ref-lock.js"></script>
</head>
<body id="ref-shell">

<!-- 本体（NCA Tools）と同じタブバー。EMER / QRH / MEL を単体で開く用 -->
<div class="tab-bar" id="main-tab-bar">
  <button class="tab-btn" data-tab="emer">EMER</button>
  <button class="tab-btn" data-tab="qrh">QRH</button>
  <button class="tab-btn" data-tab="mel">MEL</button>
  <button class="reset-btn" id="reset-btn">RESET</button>
  <button class="theme-btn" id="cache-btn" title="オフライン用キャッシュを更新（QRH画像を含む。数百MB）">📥</button>
  <button class="theme-btn" id="theme-btn" title="Day / Night">☀️</button>
</div>

<div class="tab-panel" id="tab-emer">
  <div class="tab-content" style="max-width:100% !important; margin:0 !important; padding:0; border:none; height:calc(100vh - 56px);">
    <iframe id="emer-iframe" data-page="emer.html" style="width:100%; height:100%; border:none; display:block;"></iframe>
  </div>
</div>
<div class="tab-panel" id="tab-qrh">
  <div class="tab-content" style="max-width:100% !important; margin:0 !important; padding:0; border:none; height:calc(100vh - 56px);">
    <iframe id="qrh-iframe" data-page="qrh_analysis.html" style="width:100%; height:100%; border:none; display:block;"></iframe>
  </div>
</div>
<div class="tab-panel" id="tab-mel">
  <div class="tab-content" style="max-width:100% !important; margin:0 !important; padding:0; border:none; height:calc(100vh - 56px);">
    <iframe id="mel-iframe" data-page="mel.html" style="width:100%; height:100%; border:none; display:block;"></iframe>
  </div>
</div>

<script>
/* 各ページは初めて開いたときだけ読み込む（QRHは重いため） */
function refSwitch(name) {
  document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
  document.querySelectorAll('#main-tab-bar .tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
  document.getElementById('tab-' + name).classList.add('active');
  var f = document.getElementById(name + '-iframe');
  if (f && !f.getAttribute('src')) f.setAttribute('src', f.dataset.page);
  try { localStorage.setItem('nca_ref_tab', name); } catch (e) {}
}
function refTheme(day) {
  document.body.classList.toggle('day', day);
  document.getElementById('theme-btn').textContent = day ? '🌙' : '☀️';
  ['emer-iframe', 'qrh-iframe', 'mel-iframe'].forEach(function (id) {
    var f = document.getElementById(id);
    if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'nca-theme', theme: day ? 'light' : 'dark' }, '*');
  });
}
document.querySelectorAll('#main-tab-bar .tab-btn').forEach(function (b) {
  b.addEventListener('click', function () { refSwitch(b.dataset.tab); });
});
document.getElementById('theme-btn').addEventListener('click', function () {
  var day = !document.body.classList.contains('day');
  try { localStorage.setItem('nca_theme', day ? 'day' : 'night'); } catch (e) {}
  refTheme(day);
});
['emer-iframe', 'qrh-iframe', 'mel-iframe'].forEach(function (id) {
  document.getElementById(id).addEventListener('load', function () {
    this.contentWindow.postMessage({ type: 'nca-theme', theme: document.body.classList.contains('day') ? 'light' : 'dark' }, '*');
  });
});

/* 📥 一括キャッシュ: 参照ページ本体 + QRH画像（QRHページの先読み関数を利用） */
document.getElementById('cache-btn').addEventListener('click', async function () {
  var btn = this; if (btn.disabled) return;
  btn.disabled = true; btn.textContent = '⏳'; var ok = true;
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      ok = await new Promise(function (res) {
        var ch = new MessageChannel(); ch.port1.onmessage = function (e) { res(e.data === 'done'); };
        navigator.serviceWorker.controller.postMessage('FORCE_CACHE', [ch.port2]);
      });
    } else { ok = false; }
  } catch (e) { ok = false; }
  try {
    var f = document.getElementById('qrh-iframe');
    if (!f.getAttribute('src')) {
      await new Promise(function (res) { f.addEventListener('load', res, { once: true }); f.setAttribute('src', f.dataset.page); });
    }
    var w = f.contentWindow;
    if (w && typeof w.prefetchAllImages === 'function') { var r = await w.prefetchAllImages(); if (r && r.fail) ok = false; }
  } catch (e) { ok = false; }
  btn.textContent = ok ? '✅' : '⚠️';
  setTimeout(function () { btn.textContent = '📥'; btn.disabled = false; }, 2500);
});

/* RESET: 入力データのリセット（本体のRESETと同様）。参照ページで保存される入力＝QRHの記入内容（localStorage qrh-*） */
document.getElementById('reset-btn').addEventListener('click', function () {
  if (!confirm('QRHに保存した入力内容（記入・メモ）をすべてリセットします。よろしいですか？')) return;
  try {
    Object.keys(localStorage).filter(function (k) { return k.indexOf('qrh-') === 0 && k.indexOf('migration') < 0; }).forEach(function (k) { localStorage.removeItem(k); });
  } catch (e) {}
  location.reload();
});
(function () {
  var day = false, tab = 'emer';
  try { day = localStorage.getItem('nca_theme') === 'day'; tab = localStorage.getItem('nca_ref_tab') || 'emer'; } catch (e) {}
  if (['emer', 'qrh', 'mel'].indexOf(tab) < 0) tab = 'emer';
  refTheme(day);
  refSwitch(tab);
})();
</script>
</body>
</html>
