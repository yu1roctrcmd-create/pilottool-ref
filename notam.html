<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NCA Tools - NOTAM</title>
  <link rel="stylesheet" href="ref.css">
  <script src="ref-lock.js"></script>
  <style>
    .nt-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 10px}
    .nt-chip{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:14px;padding:4px 11px;font-size:.72em;font-weight:700;cursor:pointer;font-family:inherit}
    .nt-chip.on{background:rgba(0,200,255,.14);color:var(--accent);border-color:var(--accent)}
    .nt-search{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85em;padding:7px 10px;font-family:inherit}
    .nt-item{border:1px solid var(--border);border-radius:10px;margin-bottom:16px;background:var(--card)}
    .nt-item>summary{list-style:none;cursor:pointer;padding:14px 14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
    .nt-item>summary::-webkit-details-marker{display:none}
    .nt-item>summary::before{content:'▸';color:var(--accent);font-weight:700;margin-right:2px}
    .nt-item[open]>summary::before{content:'▾'}
    .nt-no{font-family:ui-monospace,Menlo,monospace;font-size:.78em;font-weight:700;color:var(--accent);white-space:nowrap}
    .nt-title{font-size:.86em;font-weight:700;color:var(--text);flex:1;min-width:160px;line-height:1.5}
    .nt-tag{display:inline-block;border-radius:10px;padding:2px 9px;font-size:.66em;font-weight:700;white-space:nowrap;border:1px solid var(--border);color:var(--muted)}
    .nt-body{padding:4px 16px 16px;font-size:.78em;line-height:2.1;color:var(--text)}
    .nt-h{font-size:.82em;font-weight:700;color:var(--muted);letter-spacing:.03em;margin:18px 0 6px}
    .nt-orig{font-family:ui-monospace,Menlo,monospace;font-size:.82em;line-height:1.9;white-space:pre-wrap;background:rgba(128,128,128,.10);border-radius:6px;padding:8px 10px;color:var(--text)}
    .nt-imp{display:grid;grid-template-columns:76px 1fr;gap:10px 12px;margin:4px 0}
    .nt-imp .k{font-weight:700;color:var(--muted)}
    .nt-none{color:var(--muted)}
    .nt-chk{color:var(--warn);font-weight:700}
    .nt-ref a,.nt-ref button{display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:2px 9px;font-size:.92em;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
    .nt-src{font-size:.82em;color:var(--muted);margin-top:8px}
    #nt-list{display:grid;grid-template-columns:1fr;gap:0 14px;align-items:start}
    @media (min-width:640px){#nt-list{grid-template-columns:1fr 1fr}}
    #nt-list .nt-empty{grid-column:1/-1}
    #nt-list .nt-item{min-width:0}
    #nt-list .nt-item:not([open])>summary .nt-title{flex-basis:100%;order:2}
    .nm-wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-top:10px}
    .nm-chart{position:relative;flex:0 1 380px;min-width:260px;max-width:100%}
    .nm-chart img{display:block;width:100%;height:auto;border-radius:8px;background:#e8eef4}
    .nm-chart svg{position:absolute;left:0;top:0;width:100%;height:100%}
    .nt-item .nm-wrap{flex-direction:column;align-items:stretch}
    .nt-item .nm-chart{flex:none;width:100%;max-width:360px;min-width:0}
    .nt-item .nm-side{min-width:0;width:100%}
    .nm-leg li>span:last-child{min-width:0;overflow-wrap:anywhere}
    .nm-side{flex:1 1 260px;min-width:240px}
    .nm-key{display:flex;gap:12px;flex-wrap:wrap;font-size:.74em;font-weight:700;margin-bottom:8px}
    .nm-leg{list-style:none;margin:0;padding:0;font-size:.76em;line-height:1.7}
    .nm-leg li{display:flex;gap:8px;padding:7px 4px;border-bottom:1px solid var(--border);cursor:pointer}
    .nm-n{flex:0 0 22px;height:22px;border-radius:50%;color:#111;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-size:.9em}
    .nm-note{font-size:.7em;color:var(--muted);line-height:1.8;margin-top:10px}
    .nt-item.hi{border-color:var(--warn)}
    .nt-tag.sec{color:var(--accent);border-color:var(--accent)}
    .nt-tag.hi{color:var(--warn);border-color:var(--warn)}
    .nt-main{display:inline-block;margin:2px 6px 2px 0;font-size:.92em;color:var(--text);border:1px dashed var(--border);border-radius:6px;padding:2px 9px}
    .nt-main small{color:var(--muted);margin-left:4px}
    .nt-tblw{overflow-x:auto}
    .nt-tbl{border-collapse:collapse;width:100%;font-size:.95em}
    .nt-tbl th,.nt-tbl td{border:1px solid var(--border);padding:9px 10px;line-height:1.9;vertical-align:top;text-align:left}
    .nt-tbl th{color:var(--muted);font-size:.9em}
    .nt-tbl td:nth-child(2){white-space:nowrap;font-size:.92em}
    .nt-empty{font-size:.8em;color:var(--muted);padding:12px}
  </style>
</head>
<body>

<div class="tab-panel active" id="tab-notam">
<div class="tab-content">

<div class="hdr">
  <div class="hdr-left">
    <h2 style="margin:0">📑 NOTAM 知識整理</h2>
    <p class="lead" style="margin:2px 0 0">日本語訳・性能／航法要件への影響・関連マニュアル箇所を整理（機長昇格訓練の事前把握用）</p>
  </div>
</div>

<div style="font-size:0.62em;color:var(--warn);margin:6px 2px 10px;line-height:1.7">
  ⚠ 出典は<b>会社貸与EFBのスクリーンショット</b>（KZ225 RJAA→ZSPD、Oct 15、代替 ZSSS）です。同種の NOTAM は表にまとめています。NOTAM は日々変わるため、<b>当日のフライトでは必ず最新のNOTAMを確認</b>してください。「影響」「関連マニュアル」の欄のうち、原文から直接言えない部分は <span style="font-weight:700">［要確認］</span> と表示しています。
</div>

<div class="card">
  <details id="nt-mapbox" open>
  <summary class="card-title" style="cursor:pointer">🗺 NOTAM マップ（RJAA・ZSPD・ZSSS／KZ225・15-OCT）</summary>
  <div id="nt-map"></div>
  </details>
</div>

<div class="card">
  <div class="card-title">登録 NOTAM <span id="nt-count" style="font-size:.72em;font-weight:400;color:var(--muted)"></span></div>
  <div class="nt-bar" id="nt-secs"></div>
  <div class="nt-bar" id="nt-chips"></div>
  <div class="nt-bar"><input id="nt-q" class="nt-search" type="search" placeholder="🔍 NOTAM番号 / キーワード（例：GPS、EFB、RWY）" oninput="ntRender()"></div>
  <div id="nt-list"></div>
</div>

</div>
</div>

<script src="notam_data.js"></script>
<script>
var ntCat = '全て', ntSec = '全て', SECS = ['全て','General','RJAA','ZSPD','ZSSS','CHN','ASP','RJJJ','ZSHA','RKRR'];
var PRI = {high:'重要', mid:'', low:''};
function ntEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function ntCats() {
  var s = {}; NOTAMS.forEach(function (n) { n.cat.forEach(function (c) { s[c] = 1; }); });
  return ['全て'].concat(Object.keys(s));
}
function ntChips() {
  var cnt = {}; NOTAMS.forEach(function (n) { cnt[n.sec] = (cnt[n.sec] || 0) + 1; });
  document.getElementById('nt-secs').innerHTML = SECS.map(function (c) {
    return '<button class="nt-chip' + (c === ntSec ? ' on' : '') + '" onclick="ntSetSec(\'' + c + '\')">' + c + (cnt[c] ? ' ' + cnt[c] : '') + '</button>';
  }).join('') + '<button class="nt-chip' + (ntSec === '重要' ? ' on' : '') + '" onclick="ntSetSec(\'重要\')">★ 重要のみ</button>';
  document.getElementById('nt-chips').innerHTML = ntCats().map(function (c) {
    return '<button class="nt-chip' + (c === ntCat ? ' on' : '') + '" onclick="ntSetCat(\'' + c.replace(/'/g, "\\'") + '\')">' + c + '</button>';
  }).join('');
}
function ntSetCat(c) { ntCat = c; ntChips(); ntRender(); }
function ntSetSec(c) { ntSec = c; ntChips(); ntRender(); }
function ntImp(k, v) {
  var val = v ? v : '<span class="nt-none">影響なし</span>';
  val = val.replace(/［要確認[^］]*］/g, function (m) { return '<span class="nt-chk">' + m + '</span>'; });
  return '<div class="k">' + k + '</div><div>' + val + '</div>';
}
function ntRender() {
  var q = (document.getElementById('nt-q').value || '').trim().toLowerCase();
  var rows = NOTAMS.filter(function (n) {
    if (ntSec === '重要') { if (n.pri !== 'high') return false; }
    else if (ntSec !== '全て' && n.sec !== ntSec) return false;
    if (ntCat !== '全て' && n.cat.indexOf(ntCat) < 0) return false;
    if (!q) return true;
    var rt = (n.rows || []).map(function (r) { return r.no + ' ' + r.text; }).join(' ');
    return (n.no + ' ' + n.title + ' ' + n.orig + ' ' + n.ja + ' ' + (n.perf || '') + ' ' + (n.nav || '') + ' ' + (n.ops || '') + ' ' + n.cat.join(' ') + ' ' + rt).toLowerCase().indexOf(q) >= 0;
  });
  document.getElementById('nt-count').textContent = '（' + rows.length + ' / ' + NOTAMS.length + ' 項目）';
  if (!rows.length) { document.getElementById('nt-list').innerHTML = '<div class="nt-empty">該当する NOTAM はありません。</div>'; return; }
  document.getElementById('nt-list').innerHTML = rows.map(function (n) {
    var refs = (n.refs || []).map(function (r) {
      if (r.go) return '<button onclick="ntGo(\'' + r.go + '\')">' + ntEsc(r.label) + ' ↗</button>';
      if (r.jump) return '<button onclick="ntJump(\'' + r.jump.replace(/'/g, "\\'") + '\')">' + ntEsc(r.label) + ' ↓</button>';
      if (r.main) return '<span class="nt-main">' + r.label + '<small>（NCA Tools／' + ntEsc(r.main) + '）</small></span>';
      return '<span class="nt-chk">' + r.label + '</span>';
    }).join('');
    var mg = nmapItemsFor(n.no), mi = [].concat.apply([], mg.map(function (g) { return g.items; })), mp = mg.map(function (g) { return '<div class="nt-h">位置（' + ntEsc(g.chart.name) + ' チャート）</div>' + nmapHtml(g.items, g.chart); }).join('');
    var tbl = '';
    if (n.rows) tbl = '<div class="nt-h">一覧</div><div class="nt-tblw"><table class="nt-tbl"><tr><th>No.</th><th>有効</th><th>内容</th></tr>' +
      n.rows.map(function (r) { return '<tr><td class="nt-no">' + ntEsc(r.no) + ntRowTag(mi, r.no) + '</td><td>' + ntEsc(r.valid) + '</td><td>' + r.text.replace(/\n/g, '<br>') + '</td></tr>'; }).join('') + '</table></div>';
    return '<details class="nt-item' + (n.pri === 'high' ? ' hi' : '') + '" data-no="' + ntEsc(n.no) + '"' + (rows.length <= 2 ? ' open' : '') + '><summary><span class="nt-no">' + ntEsc(n.no) + '</span><span class="nt-title">' + ntEsc(n.title) + '</span>' +
      '<span class="nt-tag sec">' + ntEsc(n.sec) + '</span>' + (n.pri === 'high' ? '<span class="nt-tag hi">★重要</span>' : '') +
      n.cat.map(function (c) { return '<span class="nt-tag">' + ntEsc(c) + '</span>'; }).join('') + '</summary>' +
      '<div class="nt-body">' +
      '<div class="nt-h">日本語訳・概要</div><div>' + n.ja + '</div>' + mp + tbl +
      '<div class="nt-h">影響</div><div class="nt-imp">' + ntImp('性能', n.perf) + ntImp('航法要件', n.nav) + ntImp('運航', n.ops) + '</div>' +
      '<div class="nt-h">関連マニュアル・ツール</div><div class="nt-ref">' + (refs || '<span class="nt-none">未登録</span>') + '</div>' +
      '<div class="nt-h">原文（英語）</div><div class="nt-orig">' + ntEsc(n.orig) + '</div>' +
      '<div class="nt-src">発行／改訂：' + ntEsc(n.issued) + '　有効：' + ntEsc(n.valid) + '</div>' +
      '</div></details>';
  }).join('');
}
function ntRowTag(mi, rno) {
  var t = mi.filter(function (it) { return it.ids.indexOf(rno.replace(/\/26$/, '')) >= 0 || it.ids.indexOf(rno) >= 0; });
  return t.map(function (it) { return ' <span class="nm-n" style="background:' + NMAP_COL[it.type] + ';width:18px;height:18px;font-size:.8em">' + it.n + '</span>'; }).join('');
}
function ntJump(no) {
  ntSec = '全て'; ntCat = '全て'; document.getElementById('nt-q').value = ''; ntChips(); ntRender();
  var els = document.querySelectorAll('.nt-item');
  for (var i = 0; i < els.length; i++) {
    var d = els[i], nos = d.getAttribute('data-no');
    if (nos === no || nos.indexOf(no) >= 0) { d.open = true; d.scrollIntoView({block: 'start'}); return; }
  }
  // グループ内の個別番号を探す
  for (var j = 0; j < NOTAMS.length; j++) {
    if ((NOTAMS[j].rows || []).some(function (r) { return r.no === no; })) { ntJump(NOTAMS[j].no); return; }
  }
}
function ntGo(tab) { try { if (parent && parent.refSwitch) parent.refSwitch(tab); } catch (e) {} }
ntChips(); ntRender(); nmapRender();
</script>
</body>
</html>
